<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周末漫游</title>
<style>
/* ============================================================
   周末漫游 · Weekend Roam — 城市周末探索 App 原型
   Layout concept: 移动端单列 App（桌面居中 480px 竖屏框），
   顶部天气区 + 可滚动内容 + 底部五栏 Tab，亮色「公园绿 × 太阳橙」。
   ============================================================ */
:root{
  color-scheme: light;
  /* color */
  --bg:#E7EFEC;           /* 桌面/页面底：冷调薄荷灰 */
  --bg-app:#F5F8F7;       /* App 内底 */
  --card:#FFFFFF;
  --ink:#16332C;          /* 深青墨 */
  --ink-2:#4A625D;        /* 次级 */
  --muted:#84948F;        /* 辅助 */
  --line:#E2EBE8;         /* 描边 */
  --brand:#0FA37F;        /* 公园绿 —— 主色 / 可行 */
  --brand-deep:#0A7D61;
  --brand-soft:#E1F4EE;
  --sun:#F2A51E;          /* 太阳橙 —— 天气 / 热度 */
  --sun-soft:#FBEED2;
  --coral:#FF6B5E;        /* 珊瑚 —— 组队 CTA */
  --coral-soft:#FFE9E6;
  --shadow:0 12px 32px rgba(22,51,44,.10);
  --shadow-sm:0 2px 8px rgba(22,51,44,.07);
  /* type */
  --font:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 15% -10%, #dff2ec 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 110%, #fbeed2 0%, transparent 55%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0}
button:focus-visible, a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
img{max-width:100%}
::-webkit-scrollbar{width:0;height:0}

.app{
  position:relative;
  width:100%;max-width:480px;height:100%;
  background:var(--bg-app);
  display:flex;flex-direction:column;
  overflow:hidden;
}
@media (min-width:540px){
  .app{height:min(880px, calc(100% - 40px));border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line)}
}

/* ---------- 顶部 Header ---------- */
.topbar{
  flex:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--bg-app);
}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{
  width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#25c48f);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 4px 10px rgba(15,163,127,.35);
}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.5px;margin:0}
.brand .sub{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.city-chip{
  display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;
  box-shadow:var(--shadow-sm);
}
.city-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}

/* ---------- 天气横幅 ---------- */
.weather{
  flex:none;margin:0 max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px));
  background:linear-gradient(120deg,#0FA37F 0%,#17b98f 55%,#2cc59a 100%);
  border-radius:18px;padding:15px 16px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 8px 22px rgba(15,163,127,.30);
}
.weather::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.10)}
.weather .w-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.weather .w-note{font-size:15px;font-weight:700;line-height:1.35}
.weather .w-temp{font-size:30px;font-weight:800;letter-spacing:-1px}
.weather .w-temp small{font-size:13px;font-weight:600;opacity:.85}
.forecast{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.fc{
  flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:9px 8px;text-align:center;backdrop-filter:blur(2px);
}
.fc.today{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.5)}
.fc .d{font-size:11px;opacity:.9;font-weight:600}
.fc .ico{font-size:20px;margin:3px 0;display:block}
.fc .t{font-size:13px;font-weight:700}
.fc .hint{font-size:10px;opacity:.85;margin-top:2px}

/* ---------- 内容区 ---------- */
.main{flex:1;overflow-y:auto;padding:14px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));scroll-behavior:smooth}
.screen{display:none;animation:fade .22s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}
.sec-head h2{font-size:16px;font-weight:800;margin:0}
.sec-head .more{font-size:12px;color:var(--muted);font-weight:600}

/* 筛选 chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:2px -2px;scrollbar-width:none}
.chip{
  flex:none;font-size:13px;font-weight:600;color:var(--ink-2);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 13px;
  transition:all .15s;
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.budget.on{background:var(--sun);color:#3b2a05;border-color:var(--sun)}

/* 活动卡片 */
.card{
  background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;
  box-shadow:var(--shadow-sm);border:1px solid var(--line);
  cursor:pointer;transition:transform .15s, box-shadow .15s;
}
.card:active{transform:scale(.985)}
.card .c-top{display:flex;gap:12px;align-items:flex-start}
.thumb{
  flex:none;width:74px;height:74px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:30px;color:#fff;font-weight:700;
}
.thumb small{font-size:10px;font-weight:700;opacity:.92;letter-spacing:1px}
.card .c-body{flex:1;min-width:0}
.card .tag-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.card h3{font-size:15.5px;font-weight:700;margin:7px 0 5px;line-height:1.35}
.meta{font-size:12px;color:var(--muted);line-height:1.6;display:flex;flex-direction:column;gap:1px}
.meta b{color:var(--ink-2);font-weight:600}
.card .c-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.price{font-size:16px;font-weight:800;color:var(--coral)}
.price small{font-size:11px;font-weight:600;color:var(--muted)}
.price.free{color:var(--brand)}
.join-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--brand-deep);background:var(--brand-soft);border-radius:999px;padding:5px 10px}
.rating{font-size:12px;color:var(--sun);font-weight:700}

/* 组队卡片 */
.team-card .avatar-row{display:flex;align-items:center;margin-top:11px}
.avatars{display:flex}
.av{width:24px;height:24px;border-radius:50%;border:2px solid #fff;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin-left:-7px}
.av:first-child{margin-left:0}
.need{font-size:12px;color:var(--coral);font-weight:700;margin-left:8px}
.join-btn{
  flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--coral);
  border-radius:999px;padding:8px 16px;box-shadow:0 4px 12px rgba(255,107,94,.35);
  transition:all .15s;
}
.join-btn.joined{background:var(--brand);box-shadow:0 4px 12px rgba(15,163,127,.3)}

/* 足迹 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;box-shadow:var(--shadow-sm)}
.stat .num{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .num i{font-style:normal;font-size:12px;color:var(--muted);font-weight:600}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:3px}
.map-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:12px 0;box-shadow:var(--shadow-sm)}
.map-card .map-title{padding:12px 14px 0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.map-card .map-title span{font-size:11.5px;color:var(--muted);font-weight:600}
.map-card svg{display:block;width:100%;height:auto}
.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-sm)}
.ach .a-ico{font-size:24px}
.ach .a-t{font-size:13px;font-weight:700}
.ach .a-d{font-size:11px;color:var(--muted);margin-top:2px}
.ach.locked{opacity:.5;filter:grayscale(.4)}
.ach .lock{margin-left:auto;font-size:12px;color:var(--muted)}

/* 攻略 */
.guide-card .g-author{display:flex;align-items:center;gap:8px;margin-top:10px}
.g-author .av{width:22px;height:22px;font-size:10px;margin:0}
.g-author .nm{font-size:12px;color:var(--ink-2);font-weight:600}
.g-stats{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.g-stats button{font-size:12px;color:var(--muted);display:inline-flex;gap:4px;align-items:center;font-weight:600}
.g-stats button.liked{color:var(--coral)}

/* 我的 */
.profile-card{background:linear-gradient(135deg,#16332C,#0A7D61);border-radius:20px;padding:20px;color:#fff;box-shadow:var(--shadow)}
.profile-card .p-top{display:flex;align-items:center;gap:14px}
.p-avatar{width:58px;height:58px;border-radius:50%;background:var(--sun);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#3b2a05;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.profile-card h3{margin:0;font-size:19px;font-weight:800}
.profile-card .p-tags{font-size:12px;opacity:.85;margin-top:5px}
.p-stats{display:flex;gap:0;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}
.p-stats div{flex:1;text-align:center}
.p-stats .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.p-stats .l{font-size:11px;opacity:.8;margin-top:2px}
.list-row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.list-row .li{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.list-row .txt{flex:1;font-size:14px;font-weight:600}
.list-row .val{font-size:12px;color:var(--muted)}

/* ---------- 底部 Tab ---------- */
.tabbar{
  flex:none;display:flex;border-top:1px solid var(--line);
  background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px;font-weight:600;position:relative}
.tab .ti{font-size:21px;line-height:1}
.tab.on{color:var(--brand)}
.tab.on::before{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:3px;background:var(--brand)}

/* ---------- 弹层 / Sheet / Toast ---------- */
.overlay{position:absolute;inset:0;background:rgba(16,36,32,.42);backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.9,.3,1);max-height:88%;
  display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(16,36,32,.25);
}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:4px auto 12px;flex:none}
.sheet .s-scroll{overflow-y:auto;flex:1}
.sheet h2{font-size:20px;font-weight:800;margin:0 0 6px;line-height:1.3}
.sheet .s-meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.sheet .s-desc{font-size:13.5px;color:var(--ink-2);line-height:1.7;margin:10px 0}
.sheet .s-actions{display:flex;gap:10px;margin-top:14px;flex:none}
.btn{
  flex:1;text-align:center;font-size:14px;font-weight:700;border-radius:13px;padding:13px;
  transition:all .15s;
}
.btn.primary{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(255,107,94,.4)}
.btn.primary.joined{background:var(--brand);box-shadow:0 6px 16px rgba(15,163,127,.35)}
.btn.ghost{background:var(--bg-app);color:var(--ink-2);border:1px solid var(--line)}
.btn.ghost.saved{background:var(--sun-soft);color:#8a5a00;border-color:var(--sun)}

.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);z-index:60;
  background:var(--card);border-radius:22px;padding:20px;width:calc(100% - 44px);max-width:400px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .2s;
}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:18px;font-weight:800;margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{
  width:100%;font-family:inherit;font-size:14px;color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg-app);
}
.field input:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.modal .m-actions{display:flex;gap:10px;margin-top:16px}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}

#toast{
  position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;
  z-index:70;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;box-shadow:var(--shadow);max-width:88%;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.fab{
  position:absolute;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;
  width:52px;height:52px;border-radius:50%;background:var(--coral);color:#fff;font-size:28px;font-weight:600;
  box-shadow:0 8px 20px rgba(255,107,94,.45);display:none;align-items:center;justify-content:center;
}
.fab.show{display:flex}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo">漫</div>
      <div>
        <h1>周末漫游</h1>
        <span class="sub">WEEKEND ROAM · 城市探索</span>
      </div>
    </div>
    <div class="city-chip"><span class="dot"></span>杭州 · 本周末</div>
  </header>

  <div class="weather">
    <div class="w-top">
      <div class="w-note" id="weatherNote">周六晴好，适合户外徒步；<br>周日转雨，转室内看展正好。</div>
      <div class="w-temp">18°<small>C</small></div>
    </div>
    <div class="forecast">
      <div class="fc"><span class="d">今天 周五</span><span class="ico">🌥️</span><span class="t">16°/11°</span><span class="hint">阴</span></div>
      <div class="fc today"><span class="d">周六 11.14</span><span class="ico">☀️</span><span class="t">18°/9°</span><span class="hint">宜户外</span></div>
      <div class="fc"><span class="d">周日 11.15</span><span class="ico">🌧️</span><span class="t">15°/11°</span><span class="hint">小雨·宜室内</span></div>
    </div>
  </div>

  <main class="main" id="main">

    <!-- 首页 · 推荐 -->
    <section class="screen active" id="scr-home">
      <div class="sec-head" style="margin-top:6px"><h2>本周末 · 为你推荐</h2><span class="more">按天气 / 预算 / 兴趣</span></div>
      <div class="chips" id="typeChips"></div>
      <div class="chips" id="budgetChips" style="margin-top:8px"></div>
      <div id="homeList" style="margin-top:14px"></div>
    </section>

    <!-- 组队 -->
    <section class="screen" id="scr-team">
      <div class="sec-head" style="margin-top:6px"><h2>组队广场</h2><span class="more" id="teamCount"></span></div>
      <div id="teamList"></div>
      <p style="text-align:center;color:var(--muted);font-size:12px;margin:6px 0 0">没找到合适的？点右下角「＋」发起一个</p>
    </section>

    <!-- 足迹 -->
    <section class="screen" id="scr-foot">
      <div class="stat-grid" id="footStats"></div>
      <div class="map-card">
        <div class="map-title"><span>本周末足迹 · 杭州</span><span id="mapHint">已点亮 2 处</span></div>
        <svg viewBox="0 0 360 170" role="img" aria-label="杭州足迹地图">
          <ellipse cx="170" cy="92" rx="118" ry="44" fill="#DCEFE9"/>
          <ellipse cx="170" cy="92" rx="88" ry="28" fill="#C4E4DA"/>
          <path d="M60 120 C120 96 210 96 300 118" fill="none" stroke="#BFD9D2" stroke-width="2" stroke-dasharray="4 5"/>
          <path d="M96 130 C140 112 200 108 258 116" fill="none" stroke="#0FA37F" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
          <g font-size="11" fill="#48625D" font-weight="700">
            <text x="118" y="74">西湖</text>
          </g>
          <circle cx="112" cy="70" r="13" fill="#0FA37F" opacity=".18"/><circle cx="112" cy="70" r="6" fill="#0FA37F"/><text x="112" y="42" text-anchor="middle" font-size="10" fill="#0A7D61" font-weight="700">九溪 · 已打卡</text>
          <circle cx="226" cy="62" r="13" fill="#F2A51E" opacity=".18"/><circle cx="226" cy="62" r="6" fill="#F2A51E"/><text x="250" y="64" font-size="10" fill="#A86E06" font-weight="700">天目里 · 已打卡</text>
          <circle cx="278" cy="120" r="11" fill="#B6C4C1" opacity=".5"/><circle cx="278" cy="120" r="5" fill="#9AA9A5"/><text x="286" y="142" font-size="10" fill="#84948F" font-weight="600">酒球会 · 待打卡</text>
        </svg>
      </div>
      <div class="sec-head"><h2>打卡记录</h2><span class="more">本周 2 次</span></div>
      <div id="footList"></div>
      <div class="sec-head"><h2>成就徽章</h2><span class="more" id="achProg"></span></div>
      <div class="ach-grid" id="achList"></div>
    </section>

    <!-- 攻略 -->
    <section class="screen" id="scr-guide">
      <div class="sec-head" style="margin-top:6px"><h2>周末攻略</h2><span class="more">来自同城漫游者</span></div>
      <div class="chips" id="guideChips"></div>
      <div id="guideList" style="margin-top:14px"></div>
    </section>

    <!-- 我的 -->
    <section class="screen" id="scr-me">
      <div id="meTop"></div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-action="tab" data-tab="home"><span class="ti">🧭</span>首页</button>
    <button class="tab" data-action="tab" data-tab="team"><span class="ti">🤝</span>组队</button>
    <button class="tab" data-action="tab" data-tab="foot"><span class="ti">📍</span>足迹</button>
    <button class="tab" data-action="tab" data-tab="guide"><span class="ti">📖</span>攻略</button>

  <button class="fab" id="fab" data-action="open-publish" aria-label="发起组队">＋</button>

    <div class="s-scroll" id="sheetBody"></div>
  </div>

  <!-- 发起组队 -->
  <div class="modal" id="publishModal">
    <h3>发起组队</h3>
    <div class="field"><label>活动标题</label><input id="pTitle" placeholder="如：周六九溪徒步，找搭子" value="周六九溪徒步，找搭子"></div>
    <div class="row2">
      <div class="field"><label>类型</label>
        <select id="pType"><option>徒步</option><option>市集</option><option>展览</option><option>演出</option><option>手作</option><option>运动</option></select>
      </div>
      <div class="field"><label>出发时间</label><input id="pTime" placeholder="周六 08:30" value="周六 08:30"></div>
    </div>
    <div class="row2">
      <div class="field"><label>还缺人数</label>
        <select id="pNeed"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>

  <!-- 打卡 -->
  <div class="modal" id="checkinModal">
    <h3>完成打卡</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 12px">选择你刚刚去过的地方，点亮地图，+10 XP。</p>
    <div id="checkinChoices"></div>
    <div class="m-actions">
      <button class="btn ghost" data-action="close-all">取消</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ---------------- 数据 ---------------- */
const CAT = {

  '市集':{c:'#F2A51E', soft:'#FBEED2', icon:'🧺'},
  '演出':{c:'#FF6B5E', soft:'#FFE9E6', icon:'🎸'},

  '手作':{c:'#E8824C', soft:'#FBEAE0', icon:'🏺'},
  '运动':{c:'#2E9BD6', soft:'#E4F2FB', icon:'🚴'},
  '美食':{c:'#E85D75', soft:'#FDE7EC', icon:'🍜'},
};
const ACTIVITIES = [
  {id:'a1',cat:'徒步',title:'西湖群山轻徒步 · 九溪烟树线',place:'九溪公交站',when:'周六 08:30',price:0,priceText:'免费',weather:'户外 · 晴天',dist:'3.2km',rating:'4.8',tags:['新手友好','风景好'],desc:'从九溪入口到龙井村，约 6 公里缓坡步道，溪水、茶园与红叶一路相伴。适合第一次徒步的你，领队免费带队讲解。',need:3,max:6},
  {id:'a2',cat:'展览',title:'「无尽之蓝」青年艺术双年展',place:'浙江美术馆',when:'周六/日 10:00–18:00',price:30,priceText:'¥30 学生价',weather:'室内 · 雨天皆宜',dist:'2.1km',rating:'4.7',tags:['必看','出片'],desc:'集结 40 位青年艺术家的装置与影像作品，以「蓝色」为母题。学生凭学生证半价，周末场需提前 1 天预约。',need:3,max:8},
  {id:'a3',cat:'市集',title:'天目里「秋日慢游」周末市集',place:'天目里街区',when:'周日 11:00–20:00',price:0,priceText:'免费',weather:'户外 · 晴天',dist:'4.5km',rating:'4.6',tags:['原创手作','咖啡'],desc:'40+ 原创手作、古着与咖啡摊位，还有午后草地音乐会。免费入场，雨天顺延。适合逛吃+拍照一整天。',need:3,max:10},
  {id:'a4',cat:'演出',title:'酒球会 Livehouse · 南门乐队巡演',place:'酒球会',when:'周六 20:30',price:120,priceText:'¥120',weather:'室内 · 雨天皆宜',dist:'1.8km',rating:'4.9',tags:['氛围好','晚场'],desc:'杭州老牌 Livehouse，本周六晚独立乐队「南门」全国巡演杭州站，现场燥而不吵，散场后门口有夜宵一条街。',need:2,max:4},
  {id:'a5',cat:'手作',title:'良渚文化村 · 手作陶艺工作坊',place:'良渚文化艺术中心',when:'周日 14:00',price:88,priceText:'¥88',weather:'室内 · 雨天皆宜',dist:'12km',rating:'4.5',tags:['治愈','作品可带走'],desc:'2 小时陶艺体验，老师一对一指导，烧制后作品可带走。含材料与烧制费，雨天打发时间的好选择。',need:2,max:6},
  {id:'a6',cat:'展览',title:'德寿宫遗址博物馆 · 夜游',place:'德寿宫',when:'周六 18:30',price:0,priceText:'免费预约',weather:'室内 · 雨天皆宜',dist:'5.0km',rating:'4.8',tags:['宋韵','夜景'],desc:'南宋宫殿遗址上的沉浸式夜游，灯光复原宫苑夜景，周末夜场免费但需提前预约，名额紧张。',need:4,max:10},
  {id:'a7',cat:'运动',title:'运河夜骑 · 拱宸桥线',place:'拱宸桥',when:'周六 19:00',price:0,priceText:'免费',weather:'户外 · 晴天',dist:'3.8km',rating:'4.4',tags:['有骑行道','夜景'],desc:'沿京杭大运河 12 公里休闲夜骑，全程骑行道，途经拱宸桥、小河直街，自带车或现场借公共自行车。',need:3,max:4},
  {id:'a8',cat:'演出',title:'大屋顶「星空放映会」露营电影',place:'良渚大屋顶',when:'周六 19:30',price:40,priceText:'¥40',weather:'户外 · 晴天',dist:'11km',rating:'4.6',tags:['露营','亲子友好'],desc:'露天草坪电影，自带野餐垫，现场有帐篷与热饮摊位。晴天限定，适合朋友或亲子一起度过周六夜晚。',need:2,max:5},
];
const TEAMS = [
  {id:'t1',cat:'徒步',title:'九溪徒步，找两个搭子',owner:'小周',color:'#0FA37F',when:'周六 08:30',price:'免费',need:2,members:['🧑','👧','👦','👩'],tags:['学生党','新手友好']},
  {id:'t2',cat:'市集',title:'天目里市集逛吃小分队',owner:'Momo',color:'#F2A51E',when:'周日 14:00',price:'免费',need:3,members:['👧','👦','👩','🧒'],tags:['逛吃','拍照']},
  {id:'t3',cat:'展览',title:'双年展看展搭子（周日场）',owner:'阿禾',color:'#7C6BF0',when:'周日 10:30',price:'¥30',need:1,members:['🧑','👧'],tags:['看展','闲聊']},
  {id:'t4',cat:'演出',title:'酒球会 Livehouse 一起蹦',owner:'KK',color:'#FF6B5E',when:'周六 20:00',price:'¥120',need:2,members:['🧑','👦'],tags:['音乐','夜猫子']},
];
const GUIDES = [
  {id:'g1',cat:'Citywalk',title:'杭州一日 Citywalk：馒头山 → 河坊街 → 吴山',author:'一只橘子',color:'#0FA37F',likes:328,saves:152,summary:'全程 0 元，步行约 6 公里，从老城烟火走到山顶晚霞，附沿途小吃清单。'},
  {id:'g2',cat:'看展',title:'学生党周末「0 元看展」清单（附预约方式）',author:'阿禾',color:'#7C6BF0',likes:512,saves:289,summary:'德寿宫、浙美、国美美术馆……5 个免费展 + 预约攻略，雨天不愁去处。'},
  {id:'g3',cat:'雨天',title:'雨天室内好去处：美术馆 + 书店 + 咖啡馆地图',author:'雨天不emo',color:'#2E9BD6',likes:266,saves:130,summary:'一条雨天专属路线，全程室内，适合和搭子慢慢逛一下午。'},
  {id:'g4',cat:'徒步',title:'新手九溪徒步：装备清单 & 路线详解',author:'小周',color:'#0FA37F',likes:194,saves:87,summary:'穿什么鞋、带多少水、哪段路风景最好，一篇讲清楚，第一次也能走完全程。'},
];
const ACH = [
  {key:'first',icon:'🎉',t:'首次打卡',d:'完成第 1 次打卡',goal:1},
  {key:'explorer',icon:'🔥',t:'探索达人',d:'累计打卡 10 次',goal:10},
  {key:'citywalk',icon:'🌆',t:'城市漫游家',d:'累计打卡 20 次',goal:20},
  {key:'team',icon:'🤝',t:'组队达人',d:'成功组队 5 次',goal:5},
];

/* ---------------- 状态 ---------------- */
const SEED_CHECKINS = [
  {title:'西湖群山轻徒步 · 九溪烟树线', time:'周六 08:40'},
  {title:'天目里「秋日慢游」周末市集', time:'周日 14:20'},
];
const store = load();
let state = {
  tab:'home', type:'全部', budget:'不限', guideFilter:'全部',
  saved: new Set(store.saved||[]),
  joinedA: new Set(store.joinedA||[]),
  joinedT: new Set(store.joinedT||[]),
  liked: new Set(store.liked||[]),
  checkins: (store.checkins && store.checkins.length) ? store.checkins : SEED_CHECKINS.slice(),
  teams: store.teams || TEAMS.slice(),
  xp: store.xp||120,
  firstUnlockDone: store.firstUnlockDone||false,
};
function load(){ try{ return JSON.parse(localStorage.getItem('weekend-roam-v1')||'{}'); }catch(e){ return {}; } }
function save(){
  try{ localStorage.setItem('weekend-roam-v1', JSON.stringify({
    saved:[...state.saved], joinedA:[...state.joinedA], joinedT:[...state.joinedT],
    liked:[...state.liked], checkins:state.checkins, teams:state.teams, xp:state.xp, firstUnlockDone:state.firstUnlockDone,
  })); }catch(e){}
}

/* ---------------- 工具 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------------- 渲染 ---------------- */
function render(){ renderChips(); renderHome(); renderTeam(); renderFoot(); renderGuide(); renderMe(); save(); }

function renderChips(){
  $('#typeChips').innerHTML = ['全部','展览','市集','演出','徒步','手作','运动'].map(t=>
    `<button class="chip ${state.type===t?'on':''}" data-action="filter-type" data-v="${t}">${t}</button>`).join('');
  $('#budgetChips').innerHTML = ['不限','免费','≤50','≤100'].map(b=>
    `<button class="chip budget ${state.budget===b?'on':''}" data-action="budget" data-v="${b}">预算 · ${b}</button>`).join('');
  $('#guideChips').innerHTML = ['全部','Citywalk','看展','雨天','徒步'].map(t=>
    `<button class="chip ${state.guideFilter===t?'on':''}" data-action="guide-filter" data-v="${t}">${t}</button>`).join('');
}

function thumb(a){ return `<div class="thumb" style="background:linear-gradient(135deg,${CAT[a.cat].c},${CAT[a.cat].c}cc)">${CAT[a.cat].icon}<small>${a.cat}</small></div>`; }

function filteredActs(){
  return ACTIVITIES.filter(a=>{
    if(state.type!=='全部' && a.cat!==state.type) return false;
    if(state.budget==='免费' && a.price!==0) return false;
    if(state.budget==='≤50' && a.price>50) return false;
    if(state.budget==='≤100' && a.price>100) return false;
    return true;
  });
}

function renderHome(){
  const list = filteredActs();
  $('#homeList').innerHTML = list.map(a=>{
    const joined = state.joinedA.has(a.id);
    return `<article class="card" data-action="open-activity" data-id="${a.id}">
      <div class="c-top">
        ${thumb(a)}
        <div class="c-body">
          <div class="tag-row">
            <span class="badge" style="background:${CAT[a.cat].soft};color:${CAT[a.cat].c}">${CAT[a.cat].icon} ${a.cat}</span>
            <span class="badge" style="background:${a.weather.includes('晴天')?'var(--sun-soft)':'var(--brand-soft)'};color:${a.weather.includes('晴天')?'#A86E06':'var(--brand-deep)'}">${a.weather}</span>
          </div>
          <h3>${esc(a.title)}</h3>
          <div class="meta"><span>📍 ${a.place} · <b>${a.when}</b></span><span>🚶 距你 ${a.dist}</span></div>
        </div>
      </div>
      <div class="c-foot">
        <span class="price ${a.price===0?'free':''}">${a.priceText}</span>
        <span class="rating">★ ${a.rating}</span>
        <span class="join-pill">${joined?'已加入组队':'组队中 '+a.need+'/'+a.max}</span>
      </div>
    </article>`;
  }).join('') || `<div style="text-align:center;color:var(--muted);padding:40px 0">这个筛选下暂时没有活动，换个条件试试～</div>`;
}

function renderTeam(){
  const teams = state.teams;
  $('#teamCount').textContent = teams.length+' 支队伍正在组';
  $('#teamList').innerHTML = teams.map(t=>{
    const joined = state.joinedT.has(t.id);
    return `<article class="card team-card">
      <div class="c-top">
        <div class="thumb" style="background:linear-gradient(135deg,${t.color},${t.color}cc)">${CAT[t.cat]?.icon||'🎯'}<small>${t.cat}</small></div>
        <div class="c-body">
          <div class="tag-row">
            <span class="badge" style="background:${CAT[t.cat]?.soft||'#eee'};color:${t.color}">${t.cat}</span>
            <span class="badge" style="background:var(--bg-app);color:var(--ink-2)">${t.when}</span>
          </div>
          <h3>${esc(t.title)}</h3>
          <div class="meta"><span>发起人 <b>${t.owner}</b> · ${t.price}</span></div>
        </div>
      </div>
      <div class="avatar-row">
        <div class="avatars">${t.members.map(m=>`<span class="av" style="background:${t.color}">${m}</span>`).join('')}</div>
        <span class="need">还差 ${t.need} 人</span>
        <button class="join-btn ${joined?'joined':''}" data-action="join-team" data-id="${t.id}" style="margin-left:auto">${joined?'已加入':'加入'}</button>
      </div>
    </article>`;
  }).join('');
}

function renderFoot(){
  const n = state.checkins.length;
  $('#footStats').innerHTML = `
    <div class="stat"><div class="num">${n}<i> 次</i></div><div class="lbl">累计打卡</div></div>
    <div class="stat"><div class="num">${state.xp}<i> XP</i></div><div class="lbl">经验值</div></div>
    <div class="stat"><div class="num">${state.teams.length}<i> 队</i></div><div class="lbl">参与组队</div></div>`;
  $('#mapHint').textContent = '已点亮 '+n+' 处';
  $('#footList').innerHTML = state.checkins.length ? state.checkins.slice().reverse().map(c=>
    `<div class="list-row"><div class="li" style="background:var(--brand-soft)">📍</div><div class="txt">${esc(c.title)}</div><div class="val">${c.time} · +10 XP</div></div>`).join('')
    : `<div style="text-align:center;color:var(--muted);padding:24px 0 10px">还没有打卡记录，从首页挑个活动出发吧</div>`;
  const teamDone = state.joinedT.size + state.checkins.length*0; // 用组队数近似
  renderAch();
}
function achCount(key){ return key==='team' ? (state.teams.length - TEAMS.length + state.joinedT.size) : state.checkins.length; }
function renderAch(){
  $('#achList').innerHTML = ACH.map(a=>{
    const v = achCount(a.key);
    const done = v>=a.goal;
    return `<div class="ach ${done?'':'locked'}">
      <div class="a-ico">${a.icon}</div>
      <div><div class="a-t">${a.t}</div><div class="a-d">${a.d} · ${Math.min(v,a.goal)}/${a.goal}</div></div>
      ${done?'<span style="margin-left:auto;font-size:12px;color:var(--brand)">✓</span>':'<span class="lock">未解锁</span>'}
    </div>`;
  }).join('');
  const done = ACH.filter(a=>achCount(a.key)>=a.goal).length;
  $('#achProg').textContent = done+'/'+ACH.length+' 已点亮';
}

function renderGuide(){
  const list = GUIDES.filter(g=> state.guideFilter==='全部' || state.guideFilter===g.cat);
  $('#guideList').innerHTML = list.map(g=>{
    const liked = state.liked.has(g.id);
    return `<article class="card guide-card" data-action="like-guide" data-id="${g.id}">
      <div class="c-top">
        <div class="thumb" style="background:linear-gradient(135deg,${g.color},${g.color}cc)">📖<small>${g.cat}</small></div>
        <div class="c-body">
          <div class="tag-row"><span class="badge" style="background:${g.color}22;color:${g.color}">${g.cat}</span></div>
          <h3>${esc(g.title)}</h3>
          <div class="meta">${esc(g.summary)}</div>
        </div>
      </div>
      <div class="g-author"><span class="av" style="background:${g.color}">${g.author.slice(0,1)}</span><span class="nm">${g.author}</span></div>
      <div class="g-stats">
        <button class="${liked?'liked':''}" data-action="like-guide" data-id="${g.id}">${liked?'❤️':'🤍'} ${g.likes + (liked?1:0)}</button>
        <span>⭐ ${g.saves} 收藏</span>
        <span style="margin-left:auto">查看攻略 →</span>
      </div>
    </article>`;
  }).join('');
}

function renderMe(){
  const n = state.checkins.length;
  $('#meTop').innerHTML = `
    <div class="profile-card">
      <div class="p-top">
        <div class="p-avatar">漫</div>
        <div><h3>小漫同学</h3><div class="p-tags">杭州 · 大学生 · 周末玩家 Lv.${Math.floor(state.xp/50)+1}</div></div>
      </div>
      <div class="p-stats">
        <div><div class="n">${n}</div><div class="l">打卡</div></div>
        <div><div class="n">${state.xp}</div><div class="l">经验</div></div>
        <div><div class="n">${ACH.filter(a=>achCount(a.key)>=a.goal).length}</div><div class="l">徽章</div></div>
      </div>
    </div>
    <div class="sec-head"><h2>我的足迹城市</h2></div>
    <div class="list-row"><div class="li" style="background:var(--brand-soft)">🏞️</div><div class="txt">杭州</div><div class="val">${n} 次打卡</div></div>
    <div class="list-row"><div class="li" style="background:var(--sun-soft)">🌊</div><div class="txt">即将解锁 · 下一座城市</div><div class="val">再打卡 8 次</div></div>
    <div class="sec-head"><h2>设置</h2></div>
    <div class="list-row"><div class="li" style="background:var(--bg-app)">🎯</div><div class="txt">兴趣偏好</div><div class="val">展览 · 徒步 · 演出</div></div>
    <div class="list-row"><div class="li" style="background:var(--bg-app)">💰</div><div class="txt">默认预算</div><div class="val">100 元以内</div></div>
    <div class="list-row"><div class="li" style="background:var(--bg-app)">👥</div><div class="txt">同行人数</div><div class="val">2–4 人</div></div>
    <div class="list-row"><div class="li" style="background:var(--bg-app)">🌤️</div><div class="txt">天气提醒</div><div class="val">已开启</div></div>
    <p style="text-align:center;color:var(--muted);font-size:11px;margin:18px 0 4px">周末漫游 · 演示原型 · 数据为示例内容</p>`;
}

/* ---------------- 详情 Sheet ---------------- */
function openActivity(id){
  const a = ACTIVITIES.find(x=>x.id===id); if(!a) return;
  const joined = state.joinedA.has(a.id), saved = state.saved.has(a.id);
  $('#sheetBody').innerHTML = `
    <div class="c-top">
      ${thumb(a)}
      <div class="c-body">
        <h2>${esc(a.title)}</h2>
        <div class="meta"><span>📍 ${a.place}</span><span>🕐 ${a.when} · 🚶 ${a.dist}</span></div>
      </div>
    </div>
    <div class="s-meta">
      <span class="badge" style="background:${CAT[a.cat].soft};color:${CAT[a.cat].c}">${CAT[a.cat].icon} ${a.cat}</span>
      <span class="badge" style="background:var(--sun-soft);color:#A86E06">★ ${a.rating}</span>
      <span class="badge" style="background:${a.weather.includes('晴天')?'var(--sun-soft)':'var(--brand-soft)'};color:${a.weather.includes('晴天')?'#A86E06':'var(--brand-deep)'}">${a.weather}</span>
      ${a.tags.map(t=>`<span class="badge" style="background:var(--bg-app);color:var(--ink-2)">#${t}</span>`).join('')}
    </div>
    <p class="s-desc">${esc(a.desc)}</p>
    <div class="s-desc" style="margin:0;color:var(--coral);font-weight:700;font-size:15px">${a.priceText}</div>
    <div class="s-actions">
      <button class="btn primary ${joined?'joined':''}" data-action="join-activity" data-id="${a.id}">${joined?'✓ 已加入组队':'加入组队'}${joined?'':'（还差 '+a.need+' 人）'}</button>
      <button class="btn ghost ${saved?'saved':''}" data-action="save" data-id="${a.id}">${saved?'♥ 已收藏':'♡ 收藏'}</button>
      <button class="btn ghost" data-action="checkin-activity" data-id="${a.id}">📍打卡</button>
    </div>`;
  $('#sheet').classList.add('show'); $('#overlay').classList.add('show');
}

/* ---------------- 动作 ---------------- */
function switchTab(t){
  state.tab = t;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('#scr-'+t).classList.add('active');
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.tab===t));
  $('#fab').classList.toggle('show', t==='team');
  $('#main').scrollTop = 0;
}
function checkinActivity(id){
  const a = ACTIVITIES.find(x=>x.id===id); if(!a) return;
  doCheckin(a.title);
}
function doCheckin(title){
  const d = new Date();
  const time = '今天 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  state.checkins.push({title, time});
  state.xp += 10;
  let unlocked = null;
  ACH.forEach(a=>{ if(!unlocked && achCount(a.key)>=a.goal && a.goal===20 && state.checkins.length>=20) unlocked=a; });
  save();
  closeAll();
  render();
  toast('打卡成功 · 点亮地图 +10 XP' + (unlocked?' 🏆 解锁「'+unlocked.t+'」':''));
}
function publishTeam(){
  const title = $('#pTitle').value.trim() || '未命名组队';
  const cat = $('#pType').value, time = $('#pTime').value.trim()||'本周末';
  const need = parseInt($('#pNeed').value,10), price = $('#pPrice').value;
  const color = CAT[cat]?.c || '#0FA37F';
  state.teams.push({id:'t'+Date.now(),cat,title,owner:'我',color,when:time,price,need,members:['🧑'],tags:['新发布']});
  closeAll(); render(); switchTab('team');
  toast('组队已发布，等待搭子加入 🎉');
}

/* ---------------- 事件委托 ---------------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]'); if(!el) return;
  const act = el.dataset.action, id = el.dataset.id;
  switch(act){
    case 'tab': switchTab(el.dataset.tab); break;
    case 'filter-type': state.type = el.dataset.v; render(); break;
    case 'budget': state.budget = el.dataset.v; render(); break;
    case 'guide-filter': state.guideFilter = el.dataset.v; render(); break;
    case 'open-activity': openActivity(id); break;
    case 'join-activity':
      if(state.joinedA.has(id)){ state.joinedA.delete(id); toast('已退出组队'); }
      else { state.joinedA.add(id); toast('已加入组队，快和搭子约时间吧 🤝'); }
      openActivity(id); render(); break;
    case 'save':
      if(state.saved.has(id)){ state.saved.delete(id); toast('已取消收藏'); }
      else { state.saved.add(id); toast('已收藏，出发前可再回看'); }
      render(); openActivity(id); break;
    case 'checkin-activity': checkinActivity(id); break;
    case 'join-team':
      if(state.joinedT.has(id)){ state.joinedT.delete(id); toast('已退出这支队伍'); }
      else { state.joinedT.add(id); toast('已加入，发起人会联系你 👋'); }
      render(); break;
    case 'like-guide':
      if(state.liked.has(id)){ state.liked.delete(id); }
      else { state.liked.add(id); toast('已赞这篇攻略'); }
      render(); break;
    case 'open-publish': openPublish(); break;
    case 'publish-submit': publishTeam(); break;
    case 'close-all': closeAll(); break;
  }
});
function openPublish(){
  $('#publishModal').classList.add('show'); $('#overlay').classList.add('show');
  $('#checkinModal').classList.remove('show');
}
function openCheckin(){
  $('#checkinChoices').innerHTML = ACTIVITIES.slice(0,6).map(a=>
    `<div class="list-row" data-action="checkin-activity" data-id="${a.id}" style="cursor:pointer"><div class="li" style="background:${CAT[a.cat].soft}">${CAT[a.cat].icon}</div><div class="txt">${esc(a.title)}</div><div class="val">去打卡</div></div>`).join('');
  $('#checkinModal').classList.add('show'); $('#overlay').classList.add('show');
  $('#publishModal').classList.remove('show');
}
function closeAll(){
  $('#sheet').classList.remove('show');
  $('#publishModal').classList.remove('show');
  $('#checkinModal').classList.remove('show');
  $('#overlay').classList.remove('show');
}
/* ---------------- 初始化 ---------------- */
render();
switchTab('home');
/* 底部给足迹页一个打卡入口 */
const footScr = $('#scr-foot');
const mapCard = footScr.querySelector('.map-card');
mapCard.insertAdjacentHTML('beforebegin',
  `<div style="margin:2px 0 0"><button class="btn primary" data-action="open-checkin" style="width:100%;margin-top:4px">＋ 完成一次打卡（+10 XP）</button></div>`);
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-action="open-checkin"]');
  if(b) openCheckin();
});
</script>
</body>
</html>
